name: Build & Release

# 推送 v* 标签 → 构建 release APK 并发布到 GitHub Release
# 手动触发（workflow_dispatch）→ 只构建并上传 workflow artifact，不发 Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
      CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
      CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
      CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 有密钥 secret 时解码到仓库根目录（build.gradle 会自动识别并用于 release 签名）
      - name: Decode signing keystore
        if: env.CI_KEYSTORE_BASE64 != ''
        run: echo "$CI_KEYSTORE_BASE64" | base64 --decode > ci.keystore

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "vivoicons-${GITHUB_REF_NAME}.apk"

      # 手动触发：仅上传构建产物，不发布 Release
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vivoicons-apk
          path: vivoicons-*.apk

      # 标签推送：创建 Release 并附上 APK（已存在则只覆盖上传附件）
      - name: Create or update Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="vivoicons-${GITHUB_REF_NAME}.apk"
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，覆盖上传 APK"
            gh release upload "${GITHUB_REF_NAME}" "$APK" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$APK" \
              --title "vivoicons ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
